<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ember Staff 3D: kung fu action RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0708;--surf:#1a1112;--line:#3a2224;--ink:#f6ece6;--muted:#b49a92;--em:#ff7a1a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 system-ui,sans-serif;touch-action:manipulation}
h1{font-family:"Bricolage Grotesque","Arial Black",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:8px 10px 14px}
.stage{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#120a0c}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{touch-action:none}
#ov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(8,4,5,.86);padding:14px}
#ov h1{font-size:clamp(1.8rem,8vw,3rem);margin:0;color:var(--em)}
#ov p{color:var(--muted);max-width:40ch;margin:8px auto 14px;font-size:.95rem}
#obtns{display:grid;gap:8px;justify-items:center}
.btn{background:var(--em);color:#220c00;border:0;border-radius:14px;padding:11px 22px;font:600 .95rem "Bricolage Grotesque",sans-serif;min-width:220px}
.btn small{display:block;font-weight:400;opacity:.8}
.hidden{display:none!important}
#pad{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px}
#joy{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid var(--line);position:relative;touch-action:none;flex:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:var(--em);opacity:.85}
.acts{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
#pad button{background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:14px;height:54px;font:600 .8rem "Bricolage Grotesque",sans-serif;line-height:1.1;touch-action:none}
#pad button small{display:block;color:var(--em);font-weight:500}
#pad button.on{background:var(--em);color:#220c00}
.tip{color:var(--muted);font-size:.8rem;text-align:center;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
<div class="stage" id="stage">
<canvas id="gl"></canvas><canvas id="hud" width="640" height="400"></canvas>
<div id="ov"><div><h1 id="ot">Ember Staff 3D</h1><p id="od">Tembea ramani kubwa ya 3D, pigana na maadui, panda ngazi, na uchunguze ramani yote. Gusa na buruta skrini kugeuza kamera.</p><div id="obtns"></div></div></div>
</div>
<div id="pad">
<div id="joy" aria-label="Move stick"><div id="knob"></div></div>
<div class="acts">
<button data-a="light">Strike</button><button data-a="heavy">Smash</button><button data-a="dodge">Dodge</button>
<button data-a="flame">Flame<small>30</small></button><button data-a="ult">Phantom<small>100</small></button><button id="mapb">Map</button>
</div>
</div>
<p class="tip">Buruta skrini = kamera · Keys: WASD, J strike, K smash, L dodge, U flame, I phantom, M map. Tembelea madhabahu 5 na uchunguze ramani.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
